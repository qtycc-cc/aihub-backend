name: Build and Deploy

on:
  push:
    branches:
      - main  # 仅在推送到 main 分支时触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to Alibaba Cloud Container Registry (ACR)
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login -u "${{ secrets.ACR_USERNAME }}" --password-stdin crpi-1dvre0c8a5l92ocj.cn-guangzhou.personal.cr.aliyuncs.com

      - name: Build and push Docker image to ACR
        run: |
          IMAGE_VERSION=$(date +%Y%m%d%H%M%S)  # 生成时间戳版本号
          IMAGE_NAME=crpi-1dvre0c8a5l92ocj.cn-guangzhou.personal.cr.aliyuncs.com/qtycc/aihub-backend

          docker build -t $IMAGE_NAME:$IMAGE_VERSION .
          docker tag $IMAGE_NAME:$IMAGE_VERSION $IMAGE_NAME:latest

          docker push $IMAGE_NAME:$IMAGE_VERSION
          docker push $IMAGE_NAME:latest
